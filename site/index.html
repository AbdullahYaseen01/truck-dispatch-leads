<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Carriers: MC number + ZIP</title>
<style>
  :root { --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #2563eb; --bg: #f8fafc; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: #0f172a; color: #fff; padding: 18px 20px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: #cbd5e1; font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .l { color: var(--muted); font-size: 12px; } .stat .v { font-size: 22px; font-weight: 700; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  input, select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; min-width: 120px; color: var(--ink); }
  button, .btn { font: inherit; padding: 8px 12px; border-radius: 7px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; }
  .btn.ghost { background: #fff; color: var(--accent); }
  .wrap { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: #f1f5f9; font-size: 12px; color: var(--muted); position: sticky; top: 0; }
  td.mc { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: #dcfce7; color: #166534; }
  .tag.applied { background: #fef9c3; color: #854d0e; }
  .new { background: #dbeafe; color: #1e40af; margin-left: 6px; }
  .muted { color: var(--muted); } .foot { color: var(--muted); font-size: 12px; margin: 12px 2px; }
  .spacer { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>New US carriers: MC number + ZIP code</h1>
  <p>Official FMCSA operating-authority grants and applications (≤ 10 trucks), joined to the FMCSA census for the ZIP. Updated automatically every 4 hours.</p>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <label>Search (MC, name, DOT)<input id="q" placeholder="MC56166284"></label>
    <label>State<select id="state"><option value="">All states</option></select></label>
    <label>ZIP starts with<input id="zip" inputmode="numeric" placeholder="770"></label>
    <label>Authority<select id="auth"><option value="">Granted + applied</option><option value="granted">Granted</option><option value="applied">Applied</option></select></label>
    <label>First seen<select id="seen"><option value="">Any time</option><option value="1">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></label>
    <span class="spacer"></span>
    <button id="dl">Download filtered CSV</button>
    <a class="btn ghost" href="data/mc-zip.csv" download>Full CSV</a>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>MC number</th><th>ZIP</th><th>Carrier</th><th>State</th><th>City</th><th>USDOT</th><th>Authority</th><th>Date</th></tr></thead>
    <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
  </table></div>
  <p class="foot" id="foot"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let data = [], cols = [];
function parse(text) {
  const out = [];
  for (const line of text.split(/\r?\n/).filter(Boolean)) {
    const cells = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true; else if (ch === ',') { cells.push(cur); cur = ''; } else cur += ch;
    }
    cells.push(cur); out.push(cells);
  }
  return out;
}
const today = new Date().toISOString().slice(0, 10);
const ago = (d) => (Date.parse(today) - Date.parse(d)) / 86400000;
function filtered() {
  const q = $('q').value.trim().toLowerCase().replace(/^mc\s*-?/, ''), st = $('state').value, zip = $('zip').value.trim(), au = $('auth').value, seen = $('seen').value;
  return data.filter((r) => (!st || r.state === st) && (!zip || r.zip_code.startsWith(zip)) && (!au || r.authority === au)
    && (!seen || ago(r.first_seen) < Number(seen))
    && (!q || r.mc_number.toLowerCase().includes(q) || r.name.toLowerCase().includes(q) || r.usdot_number === q));
}
function render() {
  const rows = filtered();
  $('rows').innerHTML = rows.length ? rows.slice(0, 2000).map((r) => `<tr><td class="mc">${esc(r.mc_number)}</td><td>${esc(r.zip_code)}</td>
    <td>${esc(r.name)}${r.first_seen === today ? '<span class="tag new">new today</span>' : ''}</td><td>${esc(r.state)}</td><td>${esc(r.city)}</td><td>${esc(r.usdot_number)}</td>
    <td><span class="tag ${r.authority === 'applied' ? 'applied' : ''}">${esc(r.authority)}</span></td><td>${esc(r.event_date)}</td></tr>`).join('')
    : '<tr><td colspan="8" class="muted">No carriers match these filters.</td></tr>';
  $('foot').textContent = `${rows.length.toLocaleString()} of ${data.length.toLocaleString()} carriers shown${rows.length > 2000 ? ' (first 2,000 listed; the download has all of them)' : ''}.`;
}
$('dl').onclick = () => {
  const rows = filtered();
  const csv = [cols.join(','), ...rows.map((r) => cols.map((c) => /[",]/.test(r[c]) ? `"${r[c].replace(/"/g, '""')}"` : r[c]).join(','))].join('\n');
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: 'mc-zip-filtered.csv' });
  a.click(); URL.revokeObjectURL(a.href);
};
for (const id of ['q', 'state', 'zip', 'auth', 'seen']) $(id).addEventListener('input', render);
fetch('data/mc-zip.csv', { cache: 'no-store' }).then((r) => r.text()).then((text) => {
  const [head, ...body] = parse(text);
  cols = head;
  data = body.map((c) => Object.fromEntries(head.map((h, i) => [h, c[i] ?? ''])));
  const states = [...new Set(data.map((r) => r.state).filter(Boolean))].sort();
  $('state').insertAdjacentHTML('beforeend', states.map((s) => `<option>${esc(s)}</option>`).join(''));
  const stat = (l, v) => `<div class="stat"><div class="l">${l}</div><div class="v">${Number(v).toLocaleString()}</div></div>`;
  $('stats').innerHTML = stat('Carriers with MC + ZIP', data.length) + stat('New today', data.filter((r) => r.first_seen === today).length)
    + stat('Authority granted', data.filter((r) => r.authority === 'granted').length) + stat('Applied (pending)', data.filter((r) => r.authority === 'applied').length)
    + stat('States', states.length);
  render();
}).catch(() => { $('rows').innerHTML = '<tr><td colspan="8">Could not load the list.</td></tr>'; });
</script>
</body>
</html>
