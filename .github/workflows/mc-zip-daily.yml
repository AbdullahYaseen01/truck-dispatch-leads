name: MC + ZIP agent

# Free on a public repo: runs on GitHub's runners and pulls only public FMCSA data (no keys).
# FMCSA's authority dataset keeps only the most recent changes, so this runs often to never miss a day.
on:
  schedule:
    - cron: '17 */4 * * *' # every 4 hours
  workflow_dispatch:
    inputs:
      days:
        description: 'Look back this many days'
        default: '7'

permissions:
  contents: write

concurrency: mc-zip-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node src/export-mc-zip.js --days "${{ github.event.inputs.days || '7' }}" --out exports/mc-zip.csv
      - name: Commit the updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/mc-zip.csv
          git diff --cached --quiet || git commit -m "data: daily MC + ZIP export"
          git push
