name: MC + ZIP agent

# Free on a public repo: runs on GitHub's runners and pulls only public FMCSA data (no keys).
# FMCSA's authority dataset keeps only the most recent changes, so this runs often to never miss a day.
on:
  schedule:
    - cron: '17 */4 * * *' # every 4 hours
  workflow_dispatch:
    inputs:
      min_months:
        description: 'Authority active for at least this many months'
        default: '5'
      max_fleet:
        description: 'Max power units'
        default: '10'

permissions:
  contents: write

concurrency: mc-zip-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node src/export-mc-zip.js --min-months "${{ github.event.inputs.min_months || '5' }}" --max-fleet "${{ github.event.inputs.max_fleet || '10' }}" --out exports/mc-zip.csv
      - name: Encrypted contact list for the website (top 500 by reply likelihood)
        env:
          CONTACTS_PASSWORD: ${{ secrets.CONTACTS_PASSWORD }}
        if: env.CONTACTS_PASSWORD != ''
        run: node src/qualified-contacts.js --top 500 --min-months "${{ github.event.inputs.min_months || '5' }}" --max-fleet "${{ github.event.inputs.max_fleet || '10' }}" --out /tmp/contacts.csv --encrypt-to exports/contacts.enc.json
      - name: Commit the updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/mc-zip.csv exports/contacts.enc.json
          git diff --cached --quiet || git commit -m "data: MC + ZIP update"
          git push
